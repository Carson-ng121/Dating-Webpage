<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20y%3D%27.9em%27%20font-size%3D%2790%27%3E%F0%9F%92%8C%3C%2Ftext%3E%3C%2Fsvg%3E">
<title>约会结果 · Dating with me~</title>
<style>
*{box-sizing:border-box;}
body{
  margin:0;padding:24px 16px;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
  background:linear-gradient(90deg,#FFE4F0 0%,#FFF0F6 45%,#EFF7EF 70%,#E8F5E9 100%);
  color:#000;min-height:100vh;
}
.wrap{max-width:640px;margin:0 auto;}
h1{font-size:24px;font-weight:800;margin:0 0 4px;}
.sub{font-size:14px;color:#666;margin:0 0 20px;}
.panel{background:#fff;border:3px solid #000;border-radius:20px;padding:20px;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
input{
  flex:1;min-width:180px;font-family:inherit;font-size:15px;padding:12px;
  background:#fff;border:3px solid #000;border-radius:12px;color:#000;
}
button{
  font-family:inherit;font-size:15px;font-weight:800;padding:12px 22px;
  background:#FF4FA3;color:#fff;border:3px solid #000;border-radius:999px;cursor:pointer;
  transition:transform .1s ease;
}
button:active{transform:scale(.95);}
input:focus-visible{outline:3px solid #FF4FA3;outline-offset:3px;}
button:focus-visible{outline:3px solid #000;outline-offset:3px;}
.msg{margin-top:14px;font-size:14px;color:#666;}
.msg.err{color:#C62828;font-weight:700;}
.card{
  background:#fff;border:3px solid #000;border-radius:16px;padding:16px;margin-top:14px;
}
.card .when{font-size:12px;color:#666;margin-bottom:10px;font-variant-numeric:tabular-nums;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.box{border:2px solid #000;border-radius:10px;padding:10px;}
.box .k{font-size:12px;font-weight:800;color:#FF4FA3;text-transform:uppercase;letter-spacing:.06em;}
.box .v{font-size:16px;font-weight:800;margin-top:4px;word-break:break-word;}
.box--wide{grid-column:1 / -1;}
.dodges{margin-top:10px;font-size:13px;color:#666;}
@media (max-width:420px){ .grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="wrap">
  <h1>约会结果 💌</h1>
  <p class="sub">输入你在 Cloudflare 里设的 ADMIN_KEY 就能看到她填了什么。</p>

  <div class="panel">
    <div class="row">
      <input type="password" id="key" placeholder="ADMIN_KEY" autocomplete="current-password">
      <button type="button" id="go">查看</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div id="results"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '—' : t).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

async function load(){
  const key = $('key').value.trim();
  if (!key){ $('msg').className = 'msg err'; $('msg').textContent = '先填 ADMIN_KEY'; return; }
  $('msg').className = 'msg'; $('msg').textContent = '查询中…';
  $('results').innerHTML = '';
  try {
    const r = await fetch('/api/list', { headers: { 'x-admin-key': key } });
    const data = await r.json();
    if (!data.ok){
      $('msg').className = 'msg err';
      $('msg').textContent = '出错了：' + (data.error || r.status);
      return;
    }
    $('msg').className = 'msg';
    $('msg').textContent = '共 ' + data.count + ' 条';
    $('results').innerHTML = data.items.map(it => {
      // 新版是数组（dates / activities），旧记录是单个值（date / activity）
      const list = (arr, one) => {
        const a = Array.isArray(arr) ? arr : (one ? [one] : []);
        return a.length ? a.map(esc).join('、') : '—';
      };
      const dates = list(it.dates, it.date);
      const acts  = list(it.activities, it.activity);
      const nDates = Array.isArray(it.dates) ? it.dates.length : (it.date ? 1 : 0);
      const nActs  = Array.isArray(it.activities) ? it.activities.length : (it.activity ? 1 : 0);
      return `
      <div class="card">
        <div class="when">${esc(it.at)}${it.country ? ' · ' + esc(it.country) : ''}</div>
        <div class="grid">
          <div class="box box--wide"><div class="k">Date${nDates > 1 ? ' · ' + nDates + ' 天' : ''}</div><div class="v">${dates}</div></div>
          <div class="box box--wide"><div class="k">Time</div><div class="v">${esc(it.time)}</div></div>
          <div class="box box--wide"><div class="k">Activity${nActs > 1 ? ' · ' + nActs + ' 个' : ''}</div><div class="v">${acts}</div></div>
          <div class="box box--wide"><div class="k">Menu</div><div class="v">${esc(it.food)}</div></div>
        </div>
        ${it.dodges ? '<div class="dodges">她躲了 ' + esc(it.dodges) + ' 次「不要」😏</div>' : ''}
      </div>`;
    }).join('');
    if (!data.count) $('results').innerHTML = '<div class="card">还没有人填过。</div>';
  } catch (e){
    $('msg').className = 'msg err';
    $('msg').textContent = '请求失败：' + e.message;
  }
}

$('go').addEventListener('click', load);
$('key').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
</script>
</body>
</html>
